name: Update Instagram Grid

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch: # allow manual runs from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install instaloader
        run: pip install instaloader

      - name: Fetch latest Instagram posts
        env:
          # Optional: set these secrets in repo Settings → Secrets to avoid
          # anonymous rate-limiting. Leave unset to run anonymously.
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: python scripts/update_instagram.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www.pilarvahey.com/index.html www.pilarvahey.com/ig-images/
          if git diff --staged --quiet; then
            echo "No changes – Instagram grid is already up to date."
          else
            git commit -m "chore: update Instagram grid with latest posts"
            git push
          fi
